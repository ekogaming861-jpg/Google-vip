
name: Build Keluarga Aman APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew assembleParentDebug assembleChildDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Keluarga-Aman-APK
          path: app/build/outputs/apk/**/*.apk
          
